name: Build and deploy static game
on:
  push:
    branches: [static-browser]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check upstream compatibility
        run: node scripts/check-static-upstream.mjs
      - name: Check browser adapter
        run: pnpm --filter @spotless/web typecheck
      - name: Browser session smoke test
        run: pnpm exec tsx apps/web/scripts/static-browser.e2e.ts
      - name: Build static game
        run: pnpm --filter @spotless/web build
        env:
          VITE_STATIC_MODE: 'true'
      - name: Save portable static files
        uses: actions/upload-artifact@v4
        with:
          name: dishwasherbench-static
          path: apps/web/dist
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
